<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusNotes</title>
  <style>
    body { font-family: Arial; background: #f1f5f9; padding: 40px; }
    .container { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 12px; }
    h1 { color: #2563eb; }
    input, button { padding: 12px; margin: 5px; }
    button { background: #2563eb; color: white; border: 0; border-radius: 5px; cursor: pointer; }
    li { padding: 10px; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CampusNotes</h1>
    <p>Your simple college notes manager.</p>
    <input id="noteInput" placeholder="Write your note...">
    <button onclick="addNote()">Add Note</button>
    <ul id="notesList"></ul>
  </div>
  <script>
    let notes = JSON.parse(localStorage.getItem("notes") || "[]");
    function renderNotes() {
      const list = document.getElementById("notesList");
      list.innerHTML = "";
      notes.forEach((note, index) => {
        const li = document.createElement("li");
        li.textContent = note + " ";
        const btn = document.createElement("button");
        btn.textContent = "Delete";
        btn.onclick = () => {
          notes.splice(index, 1);
          saveNotes();
        };
        li.appendChild(btn);
        list.appendChild(li);
      });
    }
    function addNote() {
      const input = document.getElementById("noteInput");
      if (!input.value.trim()) return;
      notes.push(input.value.trim());
      input.value = "";
      saveNotes();
    }
    function saveNotes() {
      localStorage.setItem("notes", JSON.stringify(notes));
      renderNotes();
    }
    renderNotes();
  </script>
</body>
</html>
